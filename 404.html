<title>Page not found | REVIVAL</title>
<script>
  // Links typed with capitals (like /John) land here because page addresses are case-sensitive.
  // Send them to the lowercase address when it's different.
  (function () {
    var p = location.pathname, low = p.toLowerCase();
    if (low !== p) location.replace(low + location.search + location.hash);
  })();
</script>
